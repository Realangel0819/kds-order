plugins {
    id 'com.google.protobuf'
}

dependencies {
    // Web, JPA, MySQL 등 서비스 구동에 필요한 라이브러리
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'
    // gRPC Server Starter (Spring Boot 3.x 호환)
    implementation 'net.devh:grpc-server-spring-boot-starter:3.1.0.RELEASE'

    // Protobuf Java 라이브러리
    implementation 'com.google.protobuf:protobuf-java:3.25.3'

    // 생성된 gRPC 코드가 사용하는 @Generated 어노테이션 (Java 9+에서 javax.annotation 제거됨)
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    // 공통 모듈에 대한 의존성 (컴파일 시점에 common의 클래스를 사용할 수 있게 함)
    implementation project(':common')
}
// .proto 파일 컴파일 경로 설정
protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.3'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.60.0'
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

// IntelliJ 등 IDE에서 자동 생성된 소스 코드를 인식하도록 설정
sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/java'
            srcDirs 'build/generated/source/proto/main/grpc'
        }
    }
}