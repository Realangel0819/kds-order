server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3307/order_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

  # jpa 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Menu Service gRPC 클라이언트 설정
grpc.client.menu-service.host=localhost
grpc.client.menu-service.port=9090
grpc.client.menu-service.timeout-seconds=2

# Redis (분산락용)
spring.redis.host=localhost
spring.redis.port=6379
# KDS 배치 그룹핑 (Size 임계치 / Time 윈도우)
kds.batch.threshold=5
kds.batch.window-ms=30000

# Spring Batch
# 앱 기동 시 Job 자동 실행 끄기 (스케줄러/수동 API로만 실행)
spring.batch.job.enabled=false
# BATCH_JOB_INSTANCE 등 메타 테이블 자동 생성
spring.batch.jdbc.initialize-schema=always
# 일일 조리 통계 배치 실행 시각 (매일 00:10, 전날 데이터 집계)
stat.daily-cook.cron=0 10 0 * * *

# Kafka (주문 완료 이벤트 발행 + ES 색인 Consumer)
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
# Consumer 재시도 (1초부터 2배씩, 최대 4번 재시도 후 DLT로 이동)
kafka.retry.initial-interval-ms=1000
kafka.retry.max-retries=4

# Elasticsearch (검색/통계용 주문 이력)
spring.elasticsearch.uris=http://localhost:9200
# ES 재색인(정합성 보정) 배치 실행 시각 (매일 03:30, 전날 완료된 주문)
search.reindex.cron=0 30 3 * * *
