dependencies {
    // Web, JPA, MySQL 등 서비스 구동에 필요한 라이브러리
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // gRPC Client (Menu Service 호출용 Netty 전송 구현체. stub/protobuf는 common의 api로 전이됨)
    implementation 'io.grpc:grpc-netty-shaded:1.60.0'

    // 공통 모듈에 대한 의존성 (menu.proto 생성 코드: MenuGrpcServiceGrpc, MenuRequest, MenuResponse)
    implementation project(':common')

    // 분산락(Redisson) - 동시에 같은 메뉴로 몰리는 주문 요청을 직렬화하기 위한 AOP 락
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.redisson:redisson:3.37.0'

    // Spring Batch - 일일 조리 통계(DailyCookStatJob)
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    testImplementation 'org.springframework.batch:spring-batch-test'
    // Reader 단독 테스트용 인메모리 DB (개발용 order_db의 주문 데이터를 건드리지 않기 위해)
    testRuntimeOnly 'com.h2database:h2'
}