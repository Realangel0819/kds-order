plugins {
    id 'java-library'
    id 'com.google.protobuf'
}

// common은 실행 가능한 애플리케이션이 아니라 다른 모듈이 참조하는 라이브러리 모듈입니다.
bootJar {
    enabled = false
}
jar {
    enabled = true
}

dependencies {
    // menu.proto에서 생성된 stub(MenuGrpcServiceGrpc, MenuRequest, MenuResponse)을
    // menu-service(서버)와 order-service(클라이언트)가 함께 참조하므로 api로 노출합니다.
    api 'com.google.protobuf:protobuf-java:3.25.3'
    api 'io.grpc:grpc-stub:1.60.0'
    api 'io.grpc:grpc-protobuf:1.60.0'

    // 생성된 gRPC 코드가 사용하는 @Generated 어노테이션 (Java 9+에서 javax.annotation 제거됨)
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
}

// .proto 파일 컴파일 경로 설정
protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.3'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.60.0'
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

// IntelliJ 등 IDE에서 자동 생성된 소스 코드를 인식하도록 설정
sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/java'
            srcDirs 'build/generated/source/proto/main/grpc'
        }
    }
}
